<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YWT Fitness">
<title>YWT Fitness</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="apple-touch-icon.png?v=2">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --brand:#B6FF3B; --brand-soft:rgba(182,255,59,.12);
  --bg:#0B0D10; --card:#15181E; --line:#262B33; --field:#1B1F26;
  --t1:#F2F4F8; --t2:#98A2B3; --t3:#5C6470; --red:#FF6B6E;
  --radius:14px;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--t1); font-size:15px; line-height:1.5;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font-family:inherit;-webkit-appearance:none;appearance:none}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.hidden{display:none!important}
#app{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom))}
.page{min-height:100vh}

/* 顶部 */
.t-head{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 14px}
.t-date{font-size:21px;font-weight:700}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill-gray{background:var(--field);color:var(--t2)}
.pill-green{background:var(--brand-soft);color:var(--brand)}
.hint{font-size:12px;color:var(--t3);margin:0 2px 10px}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.empty-card{text-align:center;color:var(--t2);font-size:13px;padding:22px 16px}
.c-title{font-size:14px;font-weight:700;margin-bottom:10px}
.c-sub{font-size:11px;color:var(--t3);font-weight:400;margin-left:4px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--brand);color:#0B0D10;border:none;border-radius:10px;height:44px;padding:0 18px;font-size:15px;font-weight:700}
.btn:active{opacity:.85}
.btn-block{width:100%}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--t1);border-radius:10px;height:44px;padding:0 16px;font-size:14px;font-weight:500}
.btn-ghost.danger{color:var(--red);border-color:rgba(255,107,110,.4)}
.btn-danger-txt{background:none;border:none;color:var(--red);font-size:13px;padding:6px 0;cursor:pointer}

/* 训练页 */
.hero{text-align:center;padding:40px 16px}
.hero h2{font-size:17px;margin-bottom:6px}
.hero p{color:var(--t2);font-size:13px;margin-bottom:20px}
.ex-card{padding:14px 16px}
.ex-card.act{box-shadow:0 0 0 1.5px var(--brand)}
.ex-h{display:flex;align-items:center;gap:8px}
.ex-name{font-weight:700;font-size:16px;flex:1}
.tag{font-size:11px;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:2px 7px;white-space:nowrap}
.x{color:var(--t3);font-size:20px;line-height:1;padding:4px 6px;cursor:pointer}
.ex-last{font-size:12px;color:var(--t2);margin-top:6px}
.sets{margin-top:8px}
.set-row{display:flex;justify-content:space-between;align-items:center;background:var(--field);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px}
.set-row .n{color:var(--t2)}
.inp-row{display:flex;gap:8px;margin-top:10px}
.inp-row input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:16px;background:var(--field);color:var(--t1)}
.inp-row input:focus{outline:none;border-color:var(--brand)}
.inp-row .btn{height:42px;flex-shrink:0;padding:0 14px;font-size:14px}
.add-ex{width:100%;border:1.5px dashed #3A414D;background:none;border-radius:var(--radius);padding:14px;color:var(--t2);font-size:14px;margin-bottom:12px}
.t-foot{margin-top:18px}
.t-sum{text-align:center;font-size:13px;color:var(--t2);margin-bottom:10px}

/* 历史页 */
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 4px}
.stat b{display:block;font-size:20px}
.stat span{display:block;font-size:11px;color:var(--t2);margin-top:2px}
.heat-wrap{overflow-x:auto;padding:2px 0 4px}
.heat-grid{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px;width:max-content}
.hc{display:inline-block;width:13px;height:13px;border-radius:3px;cursor:pointer}
.lv0{background:#20242B}.lv1{background:#2E4420}.lv2{background:#4A7028}.lv3{background:#7DB32F}.lv4{background:var(--brand)}
.hc.fut{visibility:hidden;cursor:default}
.hc.today{box-shadow:0 0 0 1.5px #F2F4F8}
.heat-legend{display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:11px;color:var(--t2);margin-top:8px}
.heat-legend .hc{cursor:default}
.dd{background:var(--field);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13px}
.rec-h{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.rec-h .sub{display:block;font-size:12px;color:var(--t2);margin-top:2px;font-weight:400}
.chev{color:var(--t3);font-size:16px;transition:transform .15s}
.chev.open{transform:rotate(90deg)}
.rec-ex{border-top:1px solid var(--line);padding:9px 0 2px;margin-top:9px;font-size:13px}
.rec-ex b{font-size:14px;margin-right:6px}
.rec-setline{color:var(--t2);margin-top:3px}
.rec-del{margin-top:10px}
.bk-btns{display:flex;gap:8px}
.bk-btns .btn-ghost{flex:1;height:38px;font-size:13px;padding:0 6px}
.bk-hint{font-size:12px;color:var(--t3);margin-top:10px}

/* 动作库 */
.lib-form{display:flex;gap:8px}
.lib-form input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;color:var(--t1)}
.lib-form input:focus{outline:none;border-color:var(--brand)}
.lib-form select{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:var(--card);font-size:14px;color:var(--t1)}
.lib-form .btn{height:42px;flex-shrink:0;padding:0 16px;font-size:14px}
.g-title{font-size:12px;color:var(--t2);margin:16px 4px 8px}
.lib-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;cursor:pointer}
.lib-hint{font-size:12px;color:var(--t3);text-align:center;margin-top:14px}

/* 底部导航 */
#tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(11,13,16,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:50}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10px;color:var(--t3);background:none;border:none}
.tab.on{color:var(--brand)}
.tab svg{width:22px;height:22px}

/* 更新与网络提示 */
#net-tip{display:none;position:fixed;top:0;left:0;right:0;z-index:210;background:#2B2313;color:#E8B45A;font-size:12px;text-align:center;padding:calc(6px + env(safe-area-inset-top)) 12px 6px}
#upd-tip{display:none;position:fixed;left:14px;right:14px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:215;background:var(--card);border:1px solid var(--brand);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--brand);text-align:center;cursor:pointer}

/* 抽屉 */
#drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:90}
#drawer{position:fixed;left:0;right:0;bottom:0;max-height:72vh;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;z-index:95;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s ease}
#drawer.open{transform:translateY(0)}
/* 登录覆盖层（不进 tab，访客可直接关闭） */
#login{position:fixed;inset:0;background:var(--bg);z-index:120;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
#login.open{display:flex}
.lg-close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:18px;background:none;border:none;color:var(--t2);font-size:22px;padding:6px}
.lg-logo{font-size:34px;font-weight:900;color:var(--brand);letter-spacing:1px}
.lg-sub{font-size:11px;color:var(--t3);letter-spacing:3px;margin:6px 0 26px}
.lg-warn{width:100%;max-width:360px;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.4);color:#FFD166;font-size:12px;border-radius:10px;padding:9px 12px;margin-bottom:14px;line-height:1.5}
.lg-box{width:100%;max-width:360px}
.lg-row{display:flex;gap:8px;margin-bottom:10px}
.lg-cc{width:110px;flex:none;background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--t1);font-size:13px;padding:13px 8px;appearance:none;-webkit-appearance:none;outline:none}
.lg-inp{flex:1;width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--t1);font-size:16px;padding:13px 14px;outline:none;-webkit-appearance:none}
.lg-inp:focus{border-color:var(--brand)}
.lg-code{display:flex;gap:8px;margin-bottom:10px}
.lg-code .lg-inp{flex:1;letter-spacing:6px;text-align:center}
.lg-send{flex:none;width:118px;background:var(--brand-soft);border:1px solid var(--brand);border-radius:12px;color:var(--brand);font-size:13px;font-weight:700}
.lg-send:disabled{opacity:.45;border-color:var(--line);color:var(--t3);background:var(--field)}
.lg-err{min-height:18px;font-size:12px;color:var(--red);text-align:center;margin-bottom:4px}
.lg-btn{width:100%;background:var(--brand);color:#0B0D10;border:none;border-radius:12px;font-size:16px;font-weight:800;padding:14px;margin-bottom:6px}
.lg-btn:disabled{opacity:.45}
.lg-skip{width:100%;background:none;border:none;color:var(--t3);font-size:13px;text-decoration:underline;padding:10px}
.lg-priv{font-size:11px;color:var(--t3);margin-top:14px;text-align:center;line-height:1.6;max-width:360px}
.d-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;font-weight:700;font-size:16px}
.d-h .x{font-size:24px}
.d-list{overflow-y:auto;padding:4px 18px calc(20px + env(safe-area-inset-bottom))}
.d-part{font-size:12px;color:var(--t2);margin:12px 0 6px}
.d-rows{display:flex;flex-wrap:wrap;gap:8px}
.d-row{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 16px;font-size:14px;color:var(--t1)}
.d-row.sel{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.d-empty{color:var(--t2);font-size:13px;text-align:center;padding:20px 0}

/* 弹窗 */
#modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
#modal{background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;max-width:400px;padding:20px}
#modal h3{font-size:16px;margin-bottom:12px}
#modal input,#modal textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:var(--field);color:var(--t1)}
#modal input:focus,#modal textarea:focus{outline:none;border-color:var(--brand)}
#modal textarea{font-size:12px;font-family:Consolas,monospace;resize:vertical}
#modal .m-hint{font-size:12px;color:var(--t2);margin-bottom:10px}
.m-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.m-btns .btn{height:40px;padding:0 18px;font-size:14px}
.m-btns .btn-ghost{height:40px}

/* 部位标签组 */
.pc-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px;justify-content:flex-start}
.hero .pc-row{justify-content:center}
.pc-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);background:var(--field);border-radius:999px;padding:5px 12px}
.pc-chip i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* 训练备注 */
.note-box{background:#2A2617;border:1px solid #4A4128;border-radius:10px;padding:10px 12px;font-size:13px;color:#E8D48A;line-height:1.6;margin-top:10px;white-space:pre-wrap;word-break:break-word;text-align:left}
.note-link{display:inline-block;margin-top:8px;background:none;border:none;font-size:12px;color:var(--t3);padding:4px 8px}
.hero .note-link{color:var(--brand)}
.ex-card .note-link{margin:8px 0 0 -8px}
.ex-note{font-size:12px;padding:8px 10px;margin-top:8px}

/* 周训练量 */
.vol-svg{display:block;width:100%;height:auto}
.vb{fill:#2E3A1E}
.vb.cur{fill:var(--brand)}
.vt{font-size:11px;fill:var(--t2)}
.vl{font-size:11px;fill:var(--t3)}
.vl.cur{fill:var(--brand);font-weight:700}
.vline{stroke:var(--line);stroke-width:1}

/* 快捷输入 */
.quick-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.quick-row button{border:1px solid var(--line);background:var(--card);border-radius:8px;height:30px;padding:0 10px;font-size:13px;color:var(--t1)}
.quick-row button:active{border-color:var(--brand);color:var(--brand)}
.q-lb{font-size:11px;color:var(--t3)}

/* 轻提示 */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:rgba(242,244,248,.96);color:#0B0D10;font-size:14px;font-weight:600;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:all .2s;z-index:200;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 首页 ===== */
.home-hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:14px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;background:#0E1116}
.home-hero .hh-bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hh-top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:16px 16px 0}
.logo{display:inline-block;line-height:1}
.logo .lg-ywt{font-size:30px;font-weight:900;font-style:italic;letter-spacing:1px;color:var(--brand);font-family:"Arial Black","Avenir Next Condensed",-apple-system,sans-serif}
.logo .lg-slogan{display:block;font-size:9px;letter-spacing:3.5px;color:var(--t2);margin-top:5px;font-weight:600}
.hh-set{width:38px;height:38px;border-radius:12px;background:rgba(21,24,30,.72);border:1px solid var(--line);color:var(--t2);display:flex;align-items:center;justify-content:center}
.hh-set svg{width:19px;height:19px}
.hh-bottom{position:relative;padding:0 16px 16px}
.hh-quote-en{font-size:15px;font-weight:800;font-style:italic;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);letter-spacing:.3px}
.hh-quote-sub{font-size:11px;color:rgba(242,244,248,.75);margin-top:4px;letter-spacing:1px}
.quote-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;margin-bottom:12px;position:relative;overflow:hidden}
.qc-mark{position:absolute;top:2px;right:14px;font-size:52px;font-weight:900;color:var(--brand);opacity:.16;font-family:Georgia,serif;line-height:1}
.qc-cat{display:inline-block;font-size:10px;letter-spacing:2px;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:3px 10px;font-weight:700}
.qc-cn{font-size:16px;font-weight:700;line-height:1.6;margin:10px 0 6px}
.qc-en{font-size:12.5px;color:var(--t2);line-height:1.55;font-style:italic}
.qc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.qc-dots{font-size:10px;color:var(--t3);letter-spacing:2px}
.qc-next{background:none;border:1px solid var(--line);color:var(--t2);border-radius:999px;font-size:12px;padding:6px 14px;display:inline-flex;align-items:center;gap:5px}
.qc-next:active{border-color:var(--brand);color:var(--brand)}
.home-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.hstat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center}
.hstat svg{width:17px;height:17px;color:var(--brand);display:block;margin:0 auto 5px}
.hstat b{display:block;font-size:19px;font-weight:800;line-height:1.1}
.hstat span{display:block;font-size:10px;color:var(--t2);margin-top:3px}
.today-card{position:relative;border-radius:18px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line)}
.tc-bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tc-body{position:relative;padding:20px 18px;background:linear-gradient(90deg,rgba(8,10,13,.88) 30%,rgba(8,10,13,.55) 70%,rgba(8,10,13,.35))}
.tc-label{font-size:11px;letter-spacing:2.5px;color:var(--brand);font-weight:700}
.tc-title{font-size:21px;font-weight:800;color:#fff;margin:6px 0 4px}
.tc-meta{font-size:12px;color:rgba(242,244,248,.75)}
.tc-quote{font-size:12px;color:rgba(242,244,248,.6);margin-top:14px}
.tc-btn{margin-top:14px;height:42px;padding:0 22px}
.quick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}
.q-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 1px 9px;text-align:center;color:var(--t1)}
.q-item:active{border-color:var(--brand)}
.q-item svg{width:19px;height:19px;color:var(--brand);display:block;margin:0 auto 5px}
.q-item span{font-size:10px;color:var(--t2);white-space:nowrap}

/* ===== 我的 ===== */
.me-hero{text-align:center;padding:26px 16px 22px;border-radius:18px;background:linear-gradient(160deg,#141922 0%,#0E1116 70%);border:1px solid var(--line);margin-bottom:12px}
.me-hero .lg-ywt{font-size:34px}
.me-hero .me-slogan{font-size:9px;letter-spacing:3.5px;color:var(--t2);font-weight:600;margin-top:6px}
.me-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.me-stat b{display:block;font-size:22px;font-weight:800;color:var(--brand)}
.me-stat span{display:block;font-size:10px;color:var(--t2);margin-top:3px}
.me-foot{text-align:center;font-size:10px;color:var(--t3);letter-spacing:2px;padding:8px 0 4px}

/* ===== 热量管理 ===== */
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.f-item{margin-bottom:10px}
.f-item label{display:block;font-size:11px;color:var(--t2);margin-bottom:5px}
.f-item input,.f-item select{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;background:var(--field);color:var(--t1)}
.f-item input:focus,.f-item select:focus{outline:none;border-color:var(--brand)}
.f-item input[type=date],.f-item input[type=time]{font-size:14px}
.f-desc{font-size:11px;color:var(--t3);margin-top:6px;line-height:1.5}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:40px;border:1px solid var(--line);background:var(--field);border-radius:10px;color:var(--t2);font-size:14px;font-weight:600}
.seg button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.gap-cards{display:flex;flex-direction:column;gap:8px}
.gap-card{border:1px solid var(--line);background:var(--field);border-radius:12px;padding:11px 14px;text-align:left;color:var(--t1);width:100%}
.gap-card.on{border-color:var(--brand);background:var(--brand-soft)}
.gap-card b{font-size:14px;display:block}

<script>
'use strict'
/* ================= 工具 ================= */
var $ = function(s){ return document.querySelector(s) }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c] }) }
function pad(n){ return n < 10 ? '0' + n : '' + n }
function fmtDate(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) }
function todayStr(){ return fmtDate(new Date()) }
var WEEK = '日一二三四五六'
function dateText(ds){
  var p = ds.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2])
  return +p[1] + '月' + p[2] + '日 周' + WEEK[d.getDay()]
}
function shortDate(ds){ var p = ds.split('-'); return +p[1] + '/' + +p[2] }
function genId(){ return 'ex_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6) }
function deep(o){ return JSON.parse(JSON.stringify(o)) }
function trimNum(n){ n = Number(n); return n % 1 ? String(Math.round(n * 100) / 100) : String(n) }
function perfTxt(w, r){ return (Number(w) > 0 ? trimNum(w) + 'kg' : '自重') + ' × ' + r }
function totalSets(w){ return w.items.reduce(function(n, i){ return n + i.sets.length }, 0) }

/* ================= 本地数据层（localStorage） ================= */
var EX_KEY = 'fc_exercises', WK_KEY = 'fc_workouts', DRAFT_KEY = 'fc_draft'
function lsGet(k, def){
  try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v } catch (e) { return def }
}
function lsSet(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) { toast('保存失败：本地存储不可用') }
  if (k !== GIST_KEY && k !== DRAFT_KEY && k !== AUTH_KEY) gistSchedule() // 数据有变化时安排自动云备份（草稿与登录态不参与备份）
}

var PARTS = ['胸', '背', '腿', '肩', '臂', '核心', '有氧', '其他']
var DEFAULT_EXERCISES = [
  { id: 'ex_bench', name: '卧推', part: '胸' },
  { id: 'ex_incline', name: '上斜卧推', part: '胸' },
  { id: 'ex_fly', name: '飞鸟', part: '胸' },
  { id: 'ex_pullup', name: '引体向上', part: '背' },
  { id: 'ex_row', name: '划船', part: '背' },
  { id: 'ex_deadlift', name: '硬拉', part: '背' },
  { id: 'ex_squat', name: '深蹲', part: '腿' },
  { id: 'ex_lunge', name: '箭步蹲', part: '腿' },
  { id: 'ex_legpress', name: '倒蹬', part: '腿' },
  { id: 'ex_ohp', name: '推举', part: '肩' },
  { id: 'ex_latraise', name: '侧平举', part: '肩' },
  { id: 'ex_curl', name: '弯举', part: '臂' },
  { id: 'ex_pushdown', name: '绳索下压', part: '臂' },
  { id: 'ex_plank', name: '平板支撑', part: '核心' },
  { id: 'ex_crunch', name: '卷腹', part: '核心' },
  { id: 'ex_run', name: '跑步', part: '有氧' },
  { id: 'ex_rope', name: '跳绳', part: '有氧' }
]

/* ---------- 动作库 ---------- */
function getExercises(){
  var l = lsGet(EX_KEY, null)
  if (!l || !l.length) { l = deep(DEFAULT_EXERCISES); lsSet(EX_KEY, l) }
  return l
}
function saveExercises(l){ lsSet(EX_KEY, l) }
function addExercise(name, part){
  name = (name || '').trim()
  if (!name) return { ok: false, msg: '请输入动作名称' }
  var list = getExercises()
  if (list.some(function(e){ return e.name === name })) return { ok: false, msg: '动作已存在' }
  var item = { id: genId(), name: name, part: part || '其他' }
  list.push(item); saveExercises(list)
  return { ok: true, item: item }
}
function renameExercise(id, name){
  name = (name || '').trim()
  if (!name) return { ok: false, msg: '名称不能为空' }
  var list = getExercises(), it = null
  for (var i = 0; i < list.length; i++) if (list[i].id === id) it = list[i]
  if (!it) return { ok: false, msg: '动作不存在' }
  for (var j = 0; j < list.length; j++) if (list[j].id !== id && list[j].name === name) return { ok: false, msg: '动作已存在' }
  it.name = name; saveExercises(list)
  return { ok: true }
}
function removeExercise(id){ saveExercises(getExercises().filter(function(e){ return e.id !== id })) }
function groupByPart(list){
  var groups = PARTS.map(function(p){ return { part: p, items: list.filter(function(e){ return e.part === p }) } })
  list.forEach(function(e){
    if (PARTS.indexOf(e.part) < 0) {
      var g = null
      for (var i = 0; i < groups.length; i++) if (groups[i].part === e.part) g = groups[i]
      if (!g) { g = { part: e.part, items: [] }; groups.push(g) }
      g.items.push(e)
    }
  })
  return groups.filter(function(g){ return g.items.length })
}

/* ---------- 训练记录 ---------- */
function getWorkouts(){
  var l = lsGet(WK_KEY, [])
  return l.slice().sort(function(a, b){ return a.date < b.date ? 1 : -1 })
}
function getWorkout(date){
  var l = getWorkouts()
  for (var i = 0; i < l.length; i++) if (l[i].date === date) return l[i]
  return null
}
function saveWorkout(w){
  var l = lsGet(WK_KEY, []), i = l.findIndex(function(x){ return x.date === w.date })
  if (i >= 0) l[i] = w; else l.push(w)
  lsSet(WK_KEY, l)
}
function removeWorkout(date){ lsSet(WK_KEY, getWorkouts().filter(function(w){ return w.date !== date })) }
function workoutVolume(w){
  var v = 0
  w.items.forEach(function(it){
    it.sets.forEach(function(s){ v += (Number(s.weight) || 0) * (Number(s.reps) || 0) })
  })
  return Math.round(v)
}
function getLastPerformance(exerciseId, excludeDate){
  var list = getWorkouts()
  for (var i = 0; i < list.length; i++) {
    var w = list[i]
    if (w.date === excludeDate) continue
    var it = null
    for (var j = 0; j < w.items.length; j++) if (w.items[j].exerciseId === exerciseId) it = w.items[j]
    if (it && it.sets.length) {
      var best = it.sets[0]
      it.sets.forEach(function(s){ if ((Number(s.weight) || 0) > (Number(best.weight) || 0)) best = s })
      return { date: w.date, weight: Number(best.weight) || 0, reps: Number(best.reps) || 0 }
    }
  }
  return null
}

/* ---------- 草稿（切页面不丢，跨天作废） ---------- */
function getDraft(){ return lsGet(DRAFT_KEY, null) }
function saveDraft(d){ lsSet(DRAFT_KEY, d) }
function clearDraft(){ try { localStorage.removeItem(DRAFT_KEY) } catch (e) {} }

/* ---------- 统计与热力图 ---------- */
function getStats(){
  var list = getWorkouts(), now = new Date()
  var monthPrefix = now.getFullYear() + '-' + pad(now.getMonth() + 1)
  var weekStart = new Date(now)
  weekStart.setDate(now.getDate() - ((now.getDay() + 6) % 7))
  var ws = fmtDate(weekStart), today = fmtDate(now)
  return {
    total: list.length,
    month: list.filter(function(w){ return w.date.indexOf(monthPrefix) === 0 }).length,
    week: list.filter(function(w){ return w.date >= ws && w.date <= today }).length
  }
}
function buildHeatmap(weeks){
  weeks = weeks || 15
  var now = new Date(), start = new Date(now)
  start.setDate(now.getDate() - ((now.getDay() + 6) % 7) - (weeks - 1) * 7)
  var volMap = {}
  getWorkouts().forEach(function(w){ volMap[w.date] = workoutVolume(w) })
  var today = fmtDate(now), cols = []
  for (var c = 0; c < weeks; c++) {
    var days = []
    for (var r = 0; r < 7; r++) {
      var d = new Date(start)
      d.setDate(start.getDate() + c * 7 + r)
      var ds = fmtDate(d)
      days.push({ date: ds, vol: volMap[ds] || 0, future: ds > today, isToday: ds === today })
    }
    cols.push({ key: 'w' + c, days: days })
  }
  return cols
}

// 近 N 周每周训练量（从旧到新，含本周），用于周训练量曲线
function weekVolumeList(weeks) {
  weeks = weeks || 8
  const now = new Date()
  const start = new Date(now)
  start.setDate(now.getDate() - ((now.getDay() + 6) % 7) - (weeks - 1) * 7)
  const dayMap = {}
  getWorkouts().forEach(w => { dayMap[w.date] = (dayMap[w.date] || 0) + workoutVolume(w) })
  const res = []
  for (let i = 0; i < weeks; i++) {
    let vol = 0
    for (let d = 0; d < 7; d++) {
      const dd = new Date(start)
      dd.setDate(start.getDate() + i * 7 + d)
      vol += dayMap[fmtDate(dd)] || 0
    }
    const lb = new Date(start)
    lb.setDate(start.getDate() + i * 7)
    res.push({ label: (lb.getMonth() + 1) + '/' + lb.getDate(), vol: Math.round(vol) })
  }
  return res
}

/* ---------- 每日语录（原创双语，按日轮换，手动切换当日保留） ---------- */
var QUOTES = [
  { cat: 'MOTIVATION',  cn: '你不需要每天都很强大，但要每天都向前一点。', en: 'You don\'t have to be strong every day. Just keep moving forward.' },
  { cat: 'DISCIPLINE',  cn: '自律不是束缚，而是你给自己最好的自由。', en: 'Discipline isn\'t a cage — it\'s the freedom you build for yourself.' },
  { cat: 'CONSISTENCY', cn: '重复本身，就是最被低估的天赋。', en: 'Consistency is the most underrated talent.' },
  { cat: 'BREAKTHROUGH', cn: '昨天的极限，只是今天的起点。', en: 'Yesterday\'s limit is just today\'s starting line.' },
  { cat: 'HABIT',       cn: '不是每次都想练，而是从来没有放弃开始。', en: 'It\'s not about loving every workout. It\'s about never skipping the start.' },
  { cat: 'GROWTH',      cn: '进步就藏在那些不想去的训练日里。', en: 'Growth hides in the workouts you least feel like doing.' },
  { cat: 'RECOVERY',    cn: '休息也是训练的一部分，恢复好了才走得远。', en: 'Rest is part of training. Recover well, and you\'ll go far.' },
  { cat: 'CONFIDENCE',  cn: '每一组都算数，你正在悄悄变强。', en: 'Every set counts. You\'re getting stronger, quietly.' },
  { cat: 'DISCIPLINE',  cn: '想到就去做，汗水不会说谎。', en: 'Just start. Sweat never lies.' },
  { cat: 'CONSISTENCY', cn: '与其一次燃尽，不如细水长流。', en: 'Better a steady flame than a sudden blaze.' }
]
var QUOTE_KEY = 'fc_quote'
function getQuote(){
  var t = todayStr()
  var saved = lsGet(QUOTE_KEY, null)
  if (saved && saved.date === t) return { q: QUOTES[saved.idx % QUOTES.length], idx: saved.idx % QUOTES.length }
  var idx = Math.abs(t.split('-').join('') * 1) % QUOTES.length
  return { q: QUOTES[idx], idx: idx }
}
function pickQuote(){
  var t = todayStr(), cur = getQuote().idx
  var idx = (cur + 1 + Math.floor(Math.random() * (QUOTES.length - 1))) % QUOTES.length
  lsSet(QUOTE_KEY, { date: t, idx: idx })
  return idx
}

/* ---------- 连续打卡天数（自然日：从今天往回数；今天未练则从昨天起算） ---------- */
function streakDays(){
  var set = {}
  getWorkouts().forEach(function(w){ set[w.date] = 1 })
  var d = new Date()
  if (!set[fmtDate(d)]) d.setDate(d.getDate() - 1)
  var n = 0
  while (set[fmtDate(d)]) { n++; d.setDate(d.getDate() - 1) }
  return n
}

/* ================= 热量管理数据层 ================= */
var PROFILE_KEY = 'fc_profile', MEALS_KEY = 'fc_meals', WEIGHTS_KEY = 'fc_weights'

// 活动系数集中管理（经验估算值，实际消耗因人而异）
var ACTIVITY = [
  { k: 'sedentary', label: '久坐', desc: '很少运动，日常以坐着为主，几乎不锻炼', coef: 1.2 },
  { k: 'light', label: '轻度活动', desc: '每周进行 1~3 次少量轻度运动', coef: 1.375 },
  { k: 'moderate', label: '中度活动', desc: '每周进行 3~5 次规律运动', coef: 1.55 },
  { k: 'high', label: '高度活动', desc: '每周进行 6~7 次较高强度运动，或日常走动较多', coef: 1.725 },
  { k: 'extreme', label: '极高活动', desc: '每天高强度训练，或从事高强度体力劳动', coef: 1.9 }
]
var GAP_MODES = [
  { k: 'mild', label: '温和减脂', gap: 250, desc: '每日缺口约 250 kcal，速度温和、容易坚持（默认推荐）' },
  { k: 'std', label: '中等速度减脂', gap: 500, desc: '每日缺口约 500 kcal，速度更快，需关注恢复与饱腹感' },
  { k: 'custom', label: '自定义缺口', gap: 0, desc: '自行设定每日热量缺口，建议不超过 500 kcal' }
]
function activityOf(k){ for (var i = 0; i < ACTIVITY.length; i++) if (ACTIVITY[i].k === k) return ACTIVITY[i]; return ACTIVITY[2] }
function activityLabel(k){ return activityOf(k).label }

function getProfile(){ return lsGet(PROFILE_KEY, {}) }
function saveProfile(p){ lsSet(PROFILE_KEY, p) }

function getMeals(){
  var l = lsGet(MEALS_KEY, [])
  return l.slice().sort(function(a, b){ return a.date === b.date ? (a.time < b.time ? 1 : -1) : (a.date < b.date ? 1 : -1) })
}
function saveMeals(l){ lsSet(MEALS_KEY, l) }
function mealsOn(date){ return getMeals().filter(function(m){ return m.date === date }) }
function kcalOn(date){
  var n = 0
  mealsOn(date).forEach(function(m){ n += Number(m.kcal) || 0 })
  return Math.round(n)
}

function getWeights(){
  var l = lsGet(WEIGHTS_KEY, [])
  return l.slice().sort(function(a, b){ return a.date < b.date ? -1 : 1 }) // 旧 → 新
}
function saveWeight(date, kg){
  var l = lsGet(WEIGHTS_KEY, [])
  var i = l.findIndex(function(x){ return x.date === date })
  if (i >= 0) l[i].kg = kg; else l.push({ date: date, kg: kg })
  lsSet(WEIGHTS_KEY, l)
}
function latestWeight(){ var l = getWeights(); return l.length ? l[l.length - 1] : null }

/* Mifflin–St Jeor 公式估算 BMR。性别未填或基础信息不全时返回 null（不强算） */
function calcBMR(p){
  if (!p || (p.gender !== 'male' && p.gender !== 'female')) return null
  var w = Number(p.weight), h = Number(p.height), a = Number(p.age)
  if (!(w > 0) || !(h > 0) || !(a > 0)) return null
  return Math.round(10 * w + 6.25 * h - 5 * a + (p.gender === 'male' ? 5 : -161))
}
function calcTDEE(p){
  var bmr = calcBMR(p)
  if (bmr == null) return null
  return Math.round(bmr * activityOf(p.activity).coef)
}
/* 每日目标摄入 = TDEE − 缺口，含安全检查。
   返回 {ok, target, gap} 或 {blocked:true, reason} 或 {pending:true}（信息不足） */
function calcTarget(p){
  var tdee = calcTDEE(p)
  if (tdee == null) return { pending: true, target: null, gap: 0 }
  var gap = p.gapMode === 'custom' ? (Number(p.gap) || 0) : (GAP_MODES.filter(function(x){ return x.k === (p.gapMode || 'mild') })[0] || GAP_MODES[0]).gap
  if (p.gapMode === 'custom') gap = Math.max(0, Math.min(1500, gap))
  var target = Math.round(tdee - gap)
  var bmr = calcBMR(p)
  var age = Number(p.age) || 0
  if (age > 0 && age < 18)
    return { blocked: true, target: null, gap: gap, reason: '填写的年龄未满 18 岁，成人减脂热量公式不适用于未成年人。建议在家长或医生、营养师指导下制定饮食方案，不要直接使用本页推荐。' }
  var floor = p.gender === 'female' ? 1000 : 1200
  if (target < floor)
    return { blocked: true, target: null, gap: gap, reason: '按当前设置计算出的目标摄入（' + target + ' kcal/日）低于安全下限 ' + floor + ' kcal，已暂停自动推荐。过低的热量摄入存在健康风险，建议咨询医生或注册营养师。' }
  if (target < bmr)
    return { blocked: true, target: null, gap: gap, reason: '目标摄入低于估算基础代谢（BMR ' + bmr + ' kcal），长期低于基础代谢饮食存在健康风险，已暂停推荐。建议减小热量缺口或提高目标摄入。' }
  return { ok: true, target: target, gap: gap }
}
/* 目标体重合理性：BMI < 18.5 时给出警告（不阻断） */
function targetWeightWarning(p){
  var h = Number(p.height) / 100, tw = Number(p.targetWeight)
  if (!(h > 0) || !(tw > 0)) return ''
  var bmi = Math.round(tw / (h * h) * 10) / 10
  if (bmi < 18.5) return '目标体重对应 BMI 约 ' + bmi + '，低于 18.5 属偏瘦范围，不一定适合你。目标体重与完成日期能否达成无法保证，如有疑问请咨询专业人士。'
  return ''
}

function exportJSON(){
  return JSON.stringify({
    exportedAt: todayStr(),
    exercises: getExercises(),
    workouts: getWorkouts(),
    profile: getProfile(),
    meals: lsGet(MEALS_KEY, []),
    weights: lsGet(WEIGHTS_KEY, [])

function importData(text){
  var data = JSON.parse(text)
  if (!data || !Array.isArray(data.workouts)) throw new Error('备份格式不正确')
  var exs = getExercises(), exAdded = 0
  ;(Array.isArray(data.exercises) ? data.exercises : []).forEach(function(e){
    if (e && e.id && !exs.some(function(x){ return x.id === e.id })) {
      exs.push({ id: e.id, name: e.name || '未命名', part: e.part || '其他' }); exAdded++
    }
  })
  saveExercises(exs)
  var cur = lsGet(WK_KEY, []), days = 0
  data.workouts.forEach(function(w){
    if (!w || !w.date || !/^\d{4}-\d{2}-\d{2}$/.test(w.date)) return
    var items = (Array.isArray(w.items) ? w.items : []).map(function(it){
      return {
        exerciseId: it.exerciseId || '', name: it.name || '未知动作', part: it.part || '其他',
        sets: (Array.isArray(it.sets) ? it.sets : []).map(function(s){
          return { weight: Number(s.weight) || 0, reps: Number(s.reps) || 0 }
        })
      }
    }).filter(function(it){ return it.sets.length })
    if (!items.length) return
    days++
    var i = cur.findIndex(function(x){ return x.date === w.date })
    if (i < 0) { cur.push({ date: w.date, items: items }) }
    else {
      items.forEach(function(it){
        var j = cur[i].items.findIndex(function(x){ return x.exerciseId === it.exerciseId })
        if (j >= 0) cur[i].items[j] = it; else cur[i].items.push(it)
      })
    }
  })
  lsSet(WK_KEY, cur)

  // 热量模块（旧备份没有这些字段时自动跳过，不影响训练数据）
  var res = { days: days, exAdded: exAdded, meals: 0, weights: 0 }
  if (data.profile && typeof data.profile === 'object') {
    var p = getProfile(), src = data.profile
    ;['gender', 'activity', 'gapMode', 'goalDate'].forEach(function(k){
      if (typeof src[k] === 'string') p[k] = src[k].slice(0, 20)
    })
    ;['age', 'height', 'weight', 'targetWeight', 'gap'].forEach(function(k){
      if (src[k] === '' || src[k] == null) return
      var v = Number(src[k]); if (isFinite(v)) p[k] = v
    })
    saveProfile(p)
  }
  if (Array.isArray(data.meals)) {
    var ml = lsGet(MEALS_KEY, [])
    data.meals.forEach(function(m){
      if (!m || !/^\d{4}-\d{2}-\d{2}$/.test(m.date || '')) return
      var kcal = Number(m.kcal)
      if (!isFinite(kcal) || kcal < 0) return
      var item = {
        id: (typeof m.id === 'string' && m.id) ? m.id : ('m_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8)),
        date: m.date,
        time: typeof m.time === 'string' ? m.time.slice(0, 5) : '',
        name: String(m.name || '未命名').slice(0, 30),
        portion: typeof m.portion === 'string' ? m.portion.slice(0, 20) : '',
        kcal: Math.round(kcal * 10) / 10,
        protein: isFinite(Number(m.protein)) && Number(m.protein) >= 0 ? Math.round(Number(m.protein) * 10) / 10 : '',
        carb: isFinite(Number(m.carb)) && Number(m.carb) >= 0 ? Math.round(Number(m.carb) * 10) / 10 : '',
        fat: isFinite(Number(m.fat)) && Number(m.fat) >= 0 ? Math.round(Number(m.fat) * 10) / 10 : '',
        note: typeof m.note === 'string' ? m.note.slice(0, 50) : ''
      }
      var i = ml.findIndex(function(x){ return x.id === item.id })
      if (i >= 0) ml[i] = item; else ml.push(item)
      res.meals++
    })
    lsSet(MEALS_KEY, ml)
  }
  if (Array.isArray(data.weights)) {
    var wl = lsGet(WEIGHTS_KEY, [])
    data.weights.forEach(function(w){
      if (!w || !/^\d{4}-\d{2}-\d{2}$/.test(w.date || '')) return
      var kg = Number(w.kg)
      if (!(kg > 0) || kg > 500) return
      kg = Math.round(kg * 10) / 10
      var i = wl.findIndex(function(x){ return x.date === w.date })
      if (i >= 0) wl[i].kg = kg; else wl.push({ date: w.date, kg: kg })
      res.weights++
    })
    lsSet(WEIGHTS_KEY, wl)
  }
  return res
}

function persist(){ if (state.train) saveDraft(state.train) }

function prefillFor(it){
  if (it.sets.length) {

    return { w: s.weight > 0 ? trimNum(s.weight) : '', r: String(s.reps) }
  }
  var lp = getLastPerformance(it.exerciseId, state.train.date)

}

function partChips(date) {

  const map = {}
  w.items.forEach(it => {
    if (!it.sets || !it.sets.length) return

  })

  let h = '<div class="pc-row">'

    h += '<span class="pc-chip"><i style="background:' + c + '"></i>' + esc(p) + ' · ' + map[p].n + '动作 ' + map[p].sets + '组</span>'

/* ---------- 周训练量图 ---------- */
function weeklyVolumeSVG(list) {
  let max = 1
  list.forEach(x => { if (x.vol > max) max = x.vol })
  const W = 500, H = 150, L = 10, B = 24, T = 20
  const bw = (W - L * 2) / list.length
  let s = ''
  list.forEach((x, i) => {
    const cur = i === list.length - 1
    const bh = Math.max((H - B - T) * x.vol / max, x.vol > 0 ? 2 : 0)
    const bx = L + i * bw + bw * 0.16, bwd = bw * 0.68
    const y = H - B - bh
    s += '<rect x="' + bx + '" y="' + y + '" width="' + bwd + '" height="' + bh + '" rx="4" class="vb' + (cur ? ' cur' : '') + '"/>'
    if (x.vol > 0) s += '<text x="' + (bx + bwd / 2) + '" y="' + (y - 6) + '" text-anchor="middle" class="vt">' +
      (x.vol >= 10000 ? (x.vol / 1000).toFixed(1) + 'k' : x.vol) + '</text>'
    s += '<text x="' + (bx + bwd / 2) + '" y="' + (H - 8) + '" text-anchor="middle" class="vl' + (cur ? ' cur' : '') + '">' + x.label + '</text>'
  })
  return '<svg class="vol-svg" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - L) + '" y2="' + (H - B) + '" class="vline"/>' + s + '</svg>'
}

function beginTraining(){
  var today = todayStr(), saved = getWorkout(today)
  state.train = saved ? deep(saved) : { date: today, items: [] }
  state.activeIdx = -1; state.iv = { w: '', r: '' }
  persist(); renderTrain()
}
function completeTraining(){
  var t = state.train
  if (!totalSets(t)) { toast('至少记录一组才能完成训练'); return }
  saveWorkout(t); clearDraft()
  state.train = null; state.activeIdx = -1; state.iv = { w: '', r: '' }
  renderTrain(); toast('打卡成功！')
}
function addSet(){
  var it = state.train.items[state.activeIdx]
  if (!it) return
  var rEl = $('#inp-r'), wEl = $('#inp-w')
  var reps = parseInt(rEl ? rEl.value : '', 10)
  if (!(reps > 0)) { toast('请填写每组次数'); return }
  var w = parseFloat(wEl ? wEl.value : '')
  if (isNaN(w) || w < 0) w = 0
  it.sets.push({ weight: Math.round(w * 100) / 100, reps: reps })
  state.iv = prefillFor(it)
  persist(); renderTrain()
}
// 快捷键：步进调整重量/次数（不重渲染，保持输入流畅）
function quickAdj(kind, d){
  var el = $(kind === 'w' ? '#inp-w' : '#inp-r')
  if (!el) return
  var cur = parseFloat(el.value)
  if (isNaN(cur)) cur = 0
  var v = Math.round((cur + d) * 100) / 100
  if (v < 0) v = 0
  if (kind === 'r' && v < 1) v = 1
  el.value = (kind === 'w' && v === 0) ? '' : String(v)
  state.iv[kind === 'w' ? 'w' : 'r'] = el.value
}
// 快捷键：一键回填上次成绩

function drawerAdd(id){

  var exists = state.train.items.some(function(x){ return x.exerciseId === id })

  state.train.items.push(item)

function nowHM(){ var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()) }

function ringSVG(pct, used, target, over){
  var C = 2 * Math.PI * 54
  if (pct > 1) pct = 1
  if (pct < 0) pct = 0
  var col = over ? '#FF6B6E' : '#B6FF3B'
  return '<svg class="ring" viewBox="0 0 120 120">' +
    '<circle cx="60" cy="60" r="54" fill="none" stroke="#20242B" stroke-width="10"/>' +
    '<circle cx="60" cy="60" r="54" fill="none" stroke="' + col + '" stroke-width="10" stroke-linecap="round" ' +
    'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(1) + '" transform="rotate(-90 60 60)"/>' +
    '<text x="60" y="58" text-anchor="middle" class="ring-num">' + used + '</text>' +
    '<text x="60" y="76" text-anchor="middle" class="ring-sub">/ ' + target + ' kcal</text></svg>'
}

/* 体重趋势折线：最近 10 条真实记录 */
function weightTrendSVG(){
  var list = getWeights().slice(-10)
  if (list.length < 2) return ''
  var W = 500, H = 150, L = 46, R2 = 18, B = 24, T = 20
  var vals = list.map(function(x){ return x.kg })
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals)
  if (max - min < 1) { min -= 0.5; max += 0.5 }
  var n = list.length, pts = [], dots = ''
  list.forEach(function(x, i){
    var px = L + (W - L - R2) * i / (n - 1)
    var py = T + (H - T - B) * (1 - (x.kg - min) / (max - min))
    pts.push(px.toFixed(1) + ',' + py.toFixed(1))
    dots += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="3.5" class="wt-dot"/>'
    if (i === 0 || i === n - 1)
      dots += '<text x="' + px.toFixed(1) + '" y="' + (py - 9).toFixed(1) + '" text-anchor="middle" class="wt-cur">' + trimNum(x.kg) + '</text>'
    dots += '<text x="' + px.toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle" class="wt-txt">' + shortDate(x.date) + '</text>'
  })
  return '<svg class="vol-svg" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<text x="6" y="' + (T + 6) + '" class="wt-txt">' + trimNum(Math.round(max * 10) / 10) + '</text>' +
    '<text x="6" y="' + (H - B) + '" class="wt-txt">' + trimNum(Math.round(min * 10) / 10) + '</text>' +
    '<polyline points="' + pts.join(' ') + '" class="wt-line"/>' + dots + '</svg>'
}

/* 减脂进度条：仅当存在真实体重记录且目标低于起点时显示 */
function fatProgressHTML(p){
  var ws = getWeights(), tw = Number(p.targetWeight)
  if (!ws.length || !(tw > 0)) return ''
  var start = ws[0].kg, cur = ws[ws.length - 1].kg
  if (start <= tw) return ''
  var pct = (start - cur) / (start - tw)
  if (pct < 0) pct = 0
  if (pct > 1) pct = 1
  return '<div class="fp-bar"><i style="width:' + (pct * 100).toFixed(0) + '%"></i></div>' +
    '<div class="fp-txt">减脂进度约 ' + Math.round(pct * 100) + '%（起点 ' + trimNum(start) + 'kg → 目标 ' + trimNum(tw) + 'kg，按真实体重记录估算）</div>'
}

function mealRow(m){
  var macros = []
  if (Number(m.protein) > 0) macros.push('蛋白' + trimNum(m.protein) + 'g')
  if (Number(m.carb) > 0) macros.push('碳水' + trimNum(m.carb) + 'g')
  if (Number(m.fat) > 0) macros.push('脂肪' + trimNum(m.fat) + 'g')
  var meta = m.time || ''
  if (macros.length) meta += (meta ? ' · ' : '') + macros.join(' · ')
  if (m.note) meta += (meta ? ' · ' : '') + esc(m.note)
  return '<div class="meal-row" data-act="meal-edit" data-id="' + m.id + '">' +
    '<div class="mr-t"><b>' + esc(m.name) + '</b>' + (m.portion ? '<span class="mr-pt"> ' + esc(m.portion) + '</span>' : '') +
    (meta ? '<span class="mr-meta">' + meta + '</span>' : '') + '</div>' +
    '<div class="mr-k">' + Math.round(Number(m.kcal) || 0) + '<i>kcal</i></div></div>'
}

function profSummary(p){
  var parts = []
  if (p.gender === 'male') parts.push('男')
  else if (p.gender === 'female') parts.push('女')
  if (Number(p.age) > 0) parts.push(p.age + '岁')
  if (Number(p.height) > 0) parts.push(p.height + 'cm')
  if (Number(p.weight) > 0) parts.push(p.weight + 'kg')
  if (p.activity) parts.push(activityLabel(p.activity))
  return parts.length ? parts.join(' · ') : '尚未填写，点击完善'
}

  h += '<div class="f-grid">' +
    '<div class="f-item"><label>年龄（岁）</label><input id="pf-age" type="number" inputmode="numeric" min="1" max="120" placeholder="如 26" value="' + esc(numV(p.age)) + '"></div>' +

    }).join('') + '</div></div>'

function renderCalorie(){
  var el = $('#page-calorie'), p = getProfile()
  if (!state.calDate) state.calDate = todayStr()
  if (state.profOpen === null) state.profOpen = !(Number(p.weight) > 0 && Number(p.height) > 0 && Number(p.age) > 0)
  var hasCore = Number(p.weight) > 0 && Number(p.height) > 0 && Number(p.age) > 0
  var bmr = calcBMR(p), tdee = calcTDEE(p), tgt = calcTarget(p)
  var today = todayStr(), used = kcalOn(today)
  var lw = latestWeight()
  var curW = lw ? lw.kg : (Number(p.weight) > 0 ? Number(p.weight) : null)

  var h = '<div class="t-head"><div class="t-date">热量管理</div><span class="pill pill-gray">估算参考</span></div>'

  // 首次使用引导（可跳过）
  if (!hasCore && !state.guideClosed) {
    h += '<div class="card" style="border-color:rgba(182,255,59,.45)">' +
      '<div class="c-title">先完善身体档案</div>' +
      '<p style="font-size:13px;color:var(--t2);line-height:1.7;margin-bottom:12px">填写性别、年龄、身高、体重后，可估算基础代谢（BMR）与每日总消耗（TDEE），并获得每日热量目标。所有字段都可以跳过、以后再补。</p>' +
      '<button class="btn btn-block" data-act="guide-fill">开始填写</button>' +
      '<button class="btn-danger-txt" data-act="guide-skip" style="display:block;margin:4px auto 0;color:var(--t3)">暂不填写，直接浏览</button></div>'
  }

  // 热量仪表卡（目标 / 已摄入 / 剩余）
  h += '<div class="card">'
  if (tgt && tgt.ok) {
    var over = used > tgt.target
    h += ringSVG(used / tgt.target, used, tgt.target, over) +
      '<div class="cal-rows">' +
      '<div class="cal-row"><span>今日目标摄入</span><b>' + tgt.target + ' kcal</b></div>' +
      '<div class="cal-row"><span>今日已摄入</span><b>' + used + ' kcal</b></div>' +
      (over
        ? '<div class="cal-row"><span>超出目标</span><b class="red">+' + (used - tgt.target) + ' kcal</b></div>'
        : '<div class="cal-row"><span>今日剩余</span><b class="green">' + (tgt.target - used) + ' kcal</b></div>') +
      '</div>' +
      (p.goalDate && /^\d{4}-\d{2}-\d{2}$/.test(p.goalDate)
        ? '<p class="cal-note">目标日期 ' + dateText(p.goalDate) + '：能否达成取决于实际执行，无法保证，仅供参考。</p>'
        : '') +
      '<p class="cal-note">TDEE＝估算的每日总消耗；目标摄入＝建议的饮食上限；已摄入只统计手动记录的饮食；训练消耗不重复计入（TDEE 已包含日常活动量）。手表 / 器械显示的运动消耗可作参考，请勿直接叠加到 TDEE 上。</p>'
  } else if (tgt && tgt.blocked) {
    h += '<div class="cal-warn">' + esc(tgt.reason) + '</div>' +
      '<div class="cal-rows">' +
      '<div class="cal-row"><span>今日已摄入</span><b>' + used + ' kcal</b></div>' +
      (tdee != null ? '<div class="cal-row"><span>TDEE 估算</span><b>' + tdee + ' kcal</b></div>' : '') +
      '</div>' +
      '<p class="cal-note">出于安全考虑已暂停自动推荐目标摄入。</p>'
  } else {
    h += '<div class="cal-warn" style="border-color:var(--line);background:var(--field);color:var(--t2)">还没有可用的热量目标。在下方填写身体档案（性别、年龄、身高、体重）后，将自动估算 BMR / TDEE 并给出建议摄入；性别可以不填，此时暂不计算。</div>' +
      '<div class="cal-rows"><div class="cal-row"><span>今日已摄入</span><b>' + used + ' kcal</b></div></div>'
  }
  h += '</div>'

  // TDEE / BMR
  h += '<div class="stats">' +
    '<div class="stat"><b>' + (tdee != null ? tdee : '—') + '</b><span>TDEE 估算 kcal</span></div>' +
    '<div class="stat"><b>' + (bmr != null ? bmr : '—') + '</b><span>BMR 估算 kcal</span></div></div>'
  var hintTxt = 'BMR 用 Mifflin–St Jeor 公式估算；TDEE＝BMR × 活动系数。两者均为估算值，不是精确测量结果，个人实际消耗可能存在差异。'
  if (bmr == null) hintTxt += '信息不足时暂不计算，补齐后自动更新。'
  h += '<p class="hint">' + hintTxt + '</p>'

  // 体重卡
  var delta = ''
  var ws = getWeights()
  if (ws.length >= 2) {
    var diff = Math.round((ws[ws.length - 1].kg - ws[ws.length - 2].kg) * 10) / 10
    delta = (diff > 0 ? '+' : '') + trimNum(diff) + ' kg'
  }
  h += '<div class="card"><div class="c-title">体重<span class="c-sub">基于真实记录</span></div>' +
    '<div class="stats" style="margin-bottom:6px">' +
    '<div class="stat"><b>' + (curW != null ? trimNum(curW) : '—') + '</b><span>当前 kg</span></div>' +
    '<div class="stat"><b>' + (Number(p.targetWeight) > 0 ? trimNum(p.targetWeight) : '—') + '</b><span>目标 kg</span></div>' +
    '<div class="stat"><b>' + (delta || '—') + '</b><span>较上次</span></div></div>'
  if (curW != null && Number(p.targetWeight) > 0) {
    var gd = Math.round((curW - Number(p.targetWeight)) * 10) / 10
    h += gd > 0
      ? '<p class="hint" style="margin:4px 2px">距目标体重还有 ' + trimNum(gd) + ' kg</p>'
      : '<p class="hint" style="margin:4px 2px;color:var(--brand)">已达到或低于目标体重，注意保持</p>'
  }
  if (ws.length >= 2) h += weightTrendSVG()
  h += fatProgressHTML(p)
  h += '<button class="btn-ghost btn-block" data-act="weight-open" style="margin-top:10px">＋ 记录体重</button>' +
    '<p class="hint" style="margin-top:8px">单日体重受水分、饮食等影响而波动，趋势仅供参考，不代表单日真实脂肪变化；记录当天体重会同步更新档案中的体重用于计算。</p></div>'

  // 饮食记录卡（按日期查看，跨日期不混）
  var meals = mealsOn(state.calDate)
  h += '<div class="card"><div class="c-title">饮食记录<span class="c-sub">手动录入 · 热量以包装或可靠来源为准</span></div>' +
    '<div class="date-nav">' +
    '<button data-act="cal-prev" aria-label="前一天">‹</button>' +
    '<span>' + (state.calDate === today ? '今天' : dateText(state.calDate)) + '</span>' +
    '<button data-act="cal-next" aria-label="后一天"' + (state.calDate >= today ? ' disabled' : '') + '>›</button></div>' +
    '<div class="cal-row" style="border-top:none;padding-top:0"><span>当天累计摄入</span><b class="green">' + kcalOn(state.calDate) + ' kcal</b></div>'
  if (!meals.length) h += '<div class="empty-card" style="padding:14px">当天还没有饮食记录</div>'
  meals.forEach(function(m){ h += mealRow(m) })
  h += '<button class="btn-ghost btn-block" data-act="meal-add" style="margin-top:6px">＋ 添加饮食</button></div>'

  // 身体档案卡
  var twWarn = targetWeightWarning(p)
  h += '<div class="card" id="prof-card"><div class="rec-h" data-act="prof-toggle"><div><b>身体档案</b>' +
    '<span class="sub">' + profSummary(p) + '</span></div><span class="chev' + (state.profOpen ? ' open' : '') + '">›</span></div>'
  if (state.profOpen) {
    if (twWarn) h += '<div class="cal-warn">' + esc(twWarn) + '</div>'
    h += profileFormHTML(p)
  }
  h += '</div>'

  h += '<p class="hint" style="text-align:center">所有指标均为估算，不构成医疗建议；如有健康问题请咨询合格的医疗或营养专业人士</p>'
  el.innerHTML = h
}

    '<div class="f-item"><label>碳水 g（可选）</label><input id="m-carb" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0" value="' + (m ? numV(m.carb) : '') + '"></div>' +
    '<div class="f-item"><label>脂肪 g（可选）</label><input id="m-fat" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0" value="' + (m ? numV(m.fat) : '') + '"></div>' +
    '</div>' +

function mealSave(id, isNew){
  var name = ($('#m-name').value || '').trim()
  if (!name) { toast('请填写食物名称'); return }
  var kcalV = $('#m-kcal').value.trim(), kcal = parseFloat(kcalV)
  if (kcalV === '' || !(kcal >= 0)) { toast('请填写热量 kcal（不能为负）'); return }
  if (kcal > 20000) { toast('热量数值异常，请检查'); return }
  var optNum = function(elId){
    var v = $('#' + elId).value.trim()
    if (v === '') return ''
    var f = parseFloat(v)
    return (isFinite(f) && f >= 0) ? Math.round(f * 10) / 10 : NaN
  }
  var prot = optNum('m-prot'), carb = optNum('m-carb'), fat = optNum('m-fat')
  if (isNaN(prot) || isNaN(carb) || isNaN(fat)) { toast('蛋白质 / 碳水 / 脂肪需为不小于 0 的数值'); return }
  var rec = {
    id: isNew ? ('m_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8)) : id,
    date: state.calDate,
    time: $('#m-time').value || '',
    name: name,
    portion: ($('#m-portion').value || '').trim(),
    kcal: Math.round(kcal * 10) / 10,
    protein: prot, carb: carb, fat: fat,
    note: ($('#m-note').value || '').trim()
  }
  var l = lsGet(MEALS_KEY, [])
  if (isNew) l.push(rec)
  else {
    var i = l.findIndex(function(x){ return x.id === id })
    if (i >= 0) l[i] = rec; else l.push(rec)
  }
  saveMeals(l)
  closeModal(); renderCalorie()
  toast('已保存')
}
function mealDel(id){
  if (!confirm('删除这条饮食记录？')) return
  saveMeals(lsGet(MEALS_KEY, []).filter(function(x){ return x.id !== id }))
  closeModal(); renderCalorie()
  toast('已删除')
}

function weightSave(){
  var d = $('#w-date').value
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { toast('请选择日期'); return }
  if (d > todayStr()) { toast('不能记录未来日期'); return }
  var kg = parseFloat($('#w-kg').value)
  if (!(kg > 0) || kg > 500) { toast('请填写大于 0 且不超过 500 的体重'); return }
  kg = Math.round(kg * 10) / 10
  saveWeight(d, kg)
  var synced = false
  if (d === todayStr()) {
    var p = getProfile()
    p.weight = kg; saveProfile(p); synced = true
  }
  closeModal(); renderCalorie()
  toast('体重已记录' + (synced ? '，档案已同步' : ''))
}

function profileSave(){
  var p = getProfile()
  var ageV = $('#pf-age').value.trim(), age = parseInt(ageV, 10)
  if (ageV !== '' && (!(age >= 1) || age > 120)) { toast('年龄需为 1~120 之间的整数'); return }
  var htV = $('#pf-height').value.trim(), ht = parseFloat(htV)
  if (htV !== '' && (!(ht > 0) || ht > 250)) { toast('身高需为大于 0 且不超过 250 的数值'); return }
  var wtV = $('#pf-weight').value.trim(), wt = parseFloat(wtV)
  if (wtV !== '' && (!(wt > 0) || wt > 500)) { toast('体重需为大于 0 且不超过 500 的数值'); return }
  var twV = $('#pf-tw').value.trim(), tw = parseFloat(twV)
  if (twV !== '' && (!(tw > 0) || tw > 500)) { toast('目标体重需为大于 0 且不超过 500 的数值'); return }
  p.gender = state.pfGender != null ? state.pfGender : (p.gender || '')
  p.age = ageV === '' ? '' : age
  p.height = htV === '' ? '' : ht
  p.weight = wtV === '' ? '' : wt
  p.targetWeight = twV === '' ? '' : tw
  p.activity = $('#pf-act').value
  p.gapMode = state.pfGapMode || p.gapMode || 'mild'
  if (p.gapMode === 'custom') {
    var gapV = parseFloat(($('#pf-gap').value || '').trim())
    p.gap = isFinite(gapV) ? Math.max(0, Math.min(1500, gapV)) : 0
  } else p.gap = ''
  p.goalDate = $('#pf-gd').value || ''
  saveProfile(p)
  state.profOpen = false
  state.pfGender = null; state.pfGapMode = null
  renderCalorie()
  toast('档案已保存，指标已更新')
}

function openImport(){
  openModal('<h3>导入备份</h3><p class="m-hint">粘贴之前导出的 JSON 内容，将与现有数据合并（同一天同一动作会覆盖为备份里的组）。</p>' +
    '<textarea id="imp-txt" rows="9" placeholder=\'{"exportedAt":"2026-10-20", ...}\'></textarea>' +
    '<div class="m-btns"><button class="btn-ghost" data-act="modal-close">取消</button>' +
    '<button class="btn" data-act="imp-do">导入</button></div>')
}
function doImport(){
  var txt = ($('#imp-txt').value || '').trim()
  if (!txt) { toast('请先粘贴备份内容'); return }
  try {
    var r = importData(txt)
    closeModal()
    if (state.tab === 'history') renderHistory()
    if (state.tab === 'library') renderLibrary()
    if (state.tab === 'calorie') renderCalorie()
    toast('导入成功：训练 ' + r.days + ' 天' +
      (r.exAdded ? '，动作 +' + r.exAdded : '') +
      (r.meals ? '，饮食 ' + r.meals + ' 条' : '') +
      (r.weights ? '，体重 ' + r.weights + ' 条' : ''))
  } catch (err) { toast('导入失败：' + (err.message || '格式不正确')) }
}

/* ---------- 导出 ---------- */
function doCopy(text, okMsg){
  var fallback = function(){
    var ta = document.createElement('textarea')
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'
    document.body.appendChild(ta); ta.select()
    var ok = false
    try { ok = document.execCommand('copy') } catch (e) {}
    document.body.removeChild(ta)
    toast(ok ? okMsg : '复制失败，请改用「下载备份」')
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg) }, fallback)
  } else fallback()
}
function doDownload(){
  var blob = new Blob([exportJSON()], { type: 'application/json' })
  var a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = 'fitness-backup-' + todayStr() + '.json'
  document.body.appendChild(a); a.click(); a.remove()
  setTimeout(function(){ URL.revokeObjectURL(a.href) }, 3000)
  toast('已开始下载')
}

/* ---------- GitHub 自动云备份 ----------
   数据变化 → lsSet 钩子 → gistSchedule()（8 秒防抖，自动上传最少间隔 60 秒）
   首次 POST 创建私密 Gist，之后 PATCH 更新同一份；恢复 = 拉取 Gist 内容走 importData 合并 */
var GIST_KEY = 'fc_gist_cfg'
var GIST_FILE = 'ywt-fitness-backup.json'
var gistTimer = null, gistBusy = false, gistLastTry = 0
function gistCfg(){ return lsGet(GIST_KEY, { token: '', gistId: '', enabled: false, lastSync: '' }) }
function gistTime(){ var d = new Date(); return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) }
function gistSchedule(){
  var cfg = gistCfg()
  if (!cfg.enabled || !cfg.token || gistBusy) return
  clearTimeout(gistTimer)
  var wait = Math.max(8000, 60000 - (Date.now() - gistLastTry))
  gistTimer = setTimeout(function(){ gistSync(false) }, wait)
}
function gistSync(manual){
  var cfg = gistCfg()
  if (!cfg.token) { if (manual) toast('请先在「云备份设置」里填写 Token'); return }
  if (gistBusy) { if (manual) toast('正在同步中…'); return }
  gistBusy = true; gistLastTry = Date.now()
  if (manual) toast('正在上传备份…')
  var files = {}
  files[GIST_FILE] = { content: exportJSON() }
  var url = cfg.gistId ? ('https://api.github.com/gists/' + cfg.gistId) : 'https://api.github.com/gists'
  var opt = {
    method: cfg.gistId ? 'PATCH' : 'POST',
    headers: { 'Authorization': 'token ' + cfg.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(cfg.gistId ? { files: files } : { description: 'YWT Fitness 自动备份', public: false, files: files })
  }
  fetch(url, opt).then(function(res){
    if (!res.ok) return res.json().catch(function(){ return {} }).then(function(j){
      throw new Error((j && j.message) ? j.message : ('HTTP ' + res.status))
    })
    return res.json()
  }).then(function(j){
    if (!cfg.gistId && j && j.id) cfg.gistId = j.id
    cfg.lastSync = gistTime()
    lsSet(GIST_KEY, cfg)
    gistBusy = false
    if (manual) toast('云备份成功')
    if (state.tab === 'history') renderHistory()
  }).catch(function(err){
    gistBusy = false
    if (manual) toast('云备份失败：' + (err && err.message ? err.message : '网络不可达，稍后自动重试'))
  })
}
function gistRestore(){
  var cfg = gistCfg()
  if (!cfg.token || !cfg.gistId) { toast('还没有云端备份可恢复'); return }
  if (!confirm('用云端备份与本地数据合并？\n（同一天同一动作以云端为准，本地多出的记录保留）')) return
  toast('正在从云端读取…')
  fetch('https://api.github.com/gists/' + cfg.gistId, { headers: { 'Authorization': 'token ' + cfg.token, 'Accept': 'application/vnd.github+json' } })
    .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.json() })
    .then(function(j){
      var f = j.files && j.files[GIST_FILE]
      if (!f || !f.content) throw new Error('云端没有备份内容')
      var r = importData(f.content)
      closeModal()
      renderHistory()
      toast('恢复成功：训练 ' + r.days + ' 天' + (r.exAdded ? '，动作 +' + r.exAdded : ''))
    })
    .catch(function(err){ toast('恢复失败：' + (err && err.message ? err.message : '网络不可达')) })
}
function gistSave(){
  var tk = ($('#gist-token').value || '').trim()
  if (!tk) { toast('请填写 Token'); return }
  var cfg = gistCfg()
  if (tk !== cfg.token) cfg.gistId = '' // 换了 Token 就重新创建 Gist
  cfg.token = tk; cfg.enabled = true
  lsSet(GIST_KEY, cfg)
  closeModal(); renderHistory()
  gistSync(true)
}
function gistToggle(){
  var cfg = gistCfg()
  if (!cfg.token) { openGistModal(); return }
  cfg.enabled = !cfg.enabled
  lsSet(GIST_KEY, cfg); renderHistory()
  toast(cfg.enabled ? '自动云备份已开启' : '自动云备份已停用')
}
function openGistModal(){
  var cfg = gistCfg()
  openModal('<h3>GitHub 云备份设置</h3>' +
    '<p class="m-hint">① 手机浏览器打开 github.com 登录 → 右上角头像 → Settings → 拉到底部 Developer settings → Personal access tokens → Tokens (classic) → Generate new token (classic) → 勾选 gist → 生成并复制 ghp_ 开头的一串字符</p>' +
    '<input id="gist-token" value="' + esc(cfg.token) + '" placeholder="粘贴 ghp_ 开头的 Token">' +
    '<p class="m-hint">Token 只存在你手机本地；备份上传到你账号下的私密 Gist，别人看不到。开启后每次训练结束约 1 分钟内自动上传，无需任何操作。国内网络偶尔失败会静默重试，不影响正常使用。</p>' +
    '<div class="m-btns">' +
    (cfg.token ? '<button class="btn-ghost" data-act="gist-toggle">' + (cfg.enabled ? '停用自动备份' : '开启自动备份') + '</button>' : '') +
    '<button class="btn-ghost" data-act="modal-close">取消</button>' +
    '<button class="btn" data-act="gist-save">保存' + (cfg.token ? '' : '并开启') + '</button></div>')
}

/* ================= 轻提示 / 页面切换 ================= */
var toastTimer = null
function toast(msg){
  var el = $('#toast')
  el.textContent = msg; el.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(function(){ el.classList.remove('show') }, 1800)
}

var tabBtns = document.querySelectorAll('.tab')
tabBtns.forEach(function(b){ b.addEventListener('click', function(){ switchTab(b.dataset.tab) }) })
function switchTab(name){
  state.tab = name
  closeDrawer(); closeModal()
  tabBtns.forEach(function(b){ b.classList.toggle('on', b.dataset.tab === name) })
  var pages = ['home', 'train', 'history', 'library', 'me', 'calorie']
  pages.forEach(function(p){ $('#page-' + p).classList.toggle('hidden', name !== p) })
  if (name === 'home') renderHome()
  if (name === 'train') renderTrain()
  if (name === 'history') renderHistory()
  if (name === 'library') renderLibrary()
  if (name === 'me') renderMe()
  if (name === 'calorie') renderCalorie()
  window.scrollTo(0, 0)
}

/* ================= 事件委托 ================= */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]')
  if (!t) return
  var a = t.dataset.act
  var idx = t.dataset.idx != null ? +t.dataset.idx : -1
  switch (a) {
    case 'begin': beginTraining(); break
    case 'card-act': {
      var it = state.train.items[idx]
      state.activeIdx = idx; state.iv = prefillFor(it); renderTrain(); break
    }
    case 'card-del': {
      var it2 = state.train.items[idx]
      if (it2.sets.length && !confirm('删除「' + it2.name + '」和它已记录的 ' + it2.sets.length + ' 组？')) return
      state.train.items.splice(idx, 1)
      state.activeIdx = -1; state.iv = { w: '', r: '' }
      persist(); renderTrain(); break
    }
    case 'set-del': {
      var it3 = state.train.items[idx]
      it3.sets.splice(+t.dataset.si, 1)
      persist(); renderTrain(); break
    }
    case 'add-set': addSet(); break
    case 'qw': quickAdj('w', parseFloat(t.dataset.d)); break
    case 'qr': quickAdj('r', parseInt(t.dataset.d, 10)); break
    case 'q-last': quickLast(); break
    case 'complete': completeTraining(); break
    case 'drawer-open': openDrawer(); break
    case 'drawer-close': closeDrawer(); break
    case 'drawer-add': drawerAdd(t.dataset.id); break
    case 'cell': {
      var d = t.dataset.date
      state.histDetail = state.histDetail === d ? null : d
      renderHistory(); break
    }
    case 'row-toggle': {
      var d2 = t.dataset.date
      state.expanded = state.expanded === d2 ? null : d2
      renderHistory(); break
    }
    case 'day-del': {
      var d3 = t.dataset.date
      if (confirm('删除 ' + dateText(d3) + ' 的全部训练记录？')) {
        removeWorkout(d3)
        if (state.histDetail === d3) state.histDetail = null
        renderHistory(); toast('已删除')
      }
      break
    }
    case 'exp-copy': doCopy(exportJSON(), '备份已复制到剪贴板'); break
    case 'exp-dl': doDownload(); break
    case 'imp-open': openImport(); break
    case 'imp-do': doImport(); break
    case 'gist-open': openGistModal(); break
    case 'gist-save': gistSave(); break
    case 'gist-now': gistSync(true); break
    case 'gist-restore': gistRestore(); break
    case 'gist-toggle': gistToggle(); break
    case 'note-open': openNote(t.dataset.date); break
    case 'note-save': saveNote(t.dataset.date); break
    case 'quote-next': pickQuote(); renderHome(); break
    case 'home-begin': switchTab('train'); break
    case 'hh-set': case 'q-achv': case 'me-lib-back': switchTab('me'); break
    case 'q-lib': case 'me-lib': switchTab('library'); break
    case 'q-rec': case 'q-stats': case 'me-bk': switchTab('history'); break
    case 'exnote-open': openExNote(t.dataset.date || 'today', +t.dataset.idx); break
    case 'exnote-save': saveExNote(t.dataset.date || 'today', +t.dataset.idx); break
    case 'lib-add': libAdd(); break
    case 'lib-edit': openRename(t.dataset.id); break
    case 'rename-save': renameSave(t.dataset.id); break
    case 'rename-del': renameDel(t.dataset.id); break
    case 'modal-close': closeModal(); break
    case 'noop': break
    /* ---- 热量管理 ---- */
    case 'q-cal': case 'me-cal': switchTab('calorie'); break
    case 'guide-fill':
      state.guideClosed = true; state.profOpen = true; renderCalorie()
      setTimeout(function(){ var c = $('#prof-card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }) }, 60)
      break
    case 'guide-skip': state.guideClosed = true; renderCalorie(); break
    case 'prof-toggle': state.profOpen = !state.profOpen; renderCalorie(); break
    case 'pf-save': profileSave(); break
    case 'pf-gender': {
      state.pfGender = t.dataset.v
      document.querySelectorAll('[data-act="pf-gender"]').forEach(function(b){ b.classList.toggle('on', b.dataset.v === state.pfGender) })
      break
    }
    case 'pf-gapmode': {
      state.pfGapMode = t.dataset.v
      document.querySelectorAll('[data-act="pf-gapmode"]').forEach(function(b){ b.classList.toggle('on', b.dataset.v === state.pfGapMode) })
      var gw = $('#pf-gap-wrap')
      if (gw) gw.classList.toggle('hidden', state.pfGapMode !== 'custom')
      break
    }
    case 'meal-add': openMealModal(''); break
    case 'meal-edit': openMealModal(t.dataset.id); break
    case 'meal-save': mealSave(t.dataset.id, t.dataset.new === '1'); break
    case 'meal-del': mealDel(t.dataset.id); break
    case 'weight-open': openWeightModal(); break
    case 'weight-save': weightSave(); break
    case 'cal-prev': {
      var cd = new Date(state.calDate + 'T00:00:00')
      cd.setDate(cd.getDate() - 1)
      state.calDate = fmtDate(cd); renderCalorie(); break
    }
    case 'cal-next': {
      if (state.calDate >= todayStr()) break
      var cd2 = new Date(state.calDate + 'T00:00:00')
      cd2.setDate(cd2.getDate() + 1)
      state.calDate = fmtDate(cd2); renderCalorie(); break
    }
    case 'auth-open': authOpen(); break
    case 'auth-close': authClose(); break
    case 'auth-send': authSend(); break
    case 'auth-verify': authVerify(); break
    case 'auth-logout': authLogout(); break
  }
})

/* ================= 登录适配层（Supabase Phone Auth REST，零外部依赖） =================
   AUTH_URL / AUTH_ANON 留空 = 短信未配置：按钮禁用并提示，绝不接受任意验证码。
   只使用 anon public key（设计上公开）；Service Role Key 等服务端秘密严禁写进本文件。
   登录态存 fc_auth_cfg，与健身数据完全分离；退出只清此键，不触碰任何 fc_* 健身数据。 */
var AUTH_URL = '', AUTH_ANON = ''   // 待配置：Supabase Project URL + anon public key
var AUTH_KEY = 'fc_auth_cfg'
var lgTimer = null
function authState(){ return lsGet(AUTH_KEY, { phone: '', access: '', refresh: '', exp: 0, lastSend: 0 }) }
function authConfigured(){ return !!(AUTH_URL && AUTH_ANON) }
function maskPhone(p){ return (p && p.length > 7) ? p.slice(0, 3) + '****' + p.slice(-4) : (p || '') }
function supa(path, opts){
  var o = opts || {}
  var headers = Object.assign({ 'apikey': AUTH_ANON, 'Content-Type': 'application/json' }, o.headers || {})
  return fetch(AUTH_URL + path, { method: o.method || 'POST', headers: headers, body: o.body }).then(function(r){
    return r.json().catch(function(){ return null }).then(function(body){
      if (!r.ok) throw new Error((body && (body.error_description || body.msg || body.error)) || ('请求失败(' + r.status + ')'))
      return body
    })
  })
}
function authErrText(e){
  var m = String((e && e.message) || e)
  if (/429|rate|too many|frequen/i.test(m)) return '操作过于频繁，请稍后再试'
  if (/invalid|expired|token/i.test(m)) return '验证码错误或已过期'
  if (/phone/i.test(m) && /invalid|format/i.test(m)) return '手机号格式不正确'
  if (/Failed to fetch|NetworkError|network/i.test(m)) return '网络连接失败，请检查网络'
  return m
}
function authOpen(){
  var l = document.getElementById('login')
  if (!l) return
  l.classList.add('open')
  renderAuthUI()
}
function authClose(){
  var l = document.getElementById('login')
  if (l) l.classList.remove('open')
  clearInterval(lgTimer)
}
function renderAuthUI(){
  var cfgd = authConfigured()
  var w = document.getElementById('lg-warn')
  var send = document.getElementById('lg-send')
  var go = document.getElementById('lg-go')
  if (w) w.style.display = cfgd ? 'none' : 'block'
  if (send && !cfgd) { send.disabled = true; send.textContent = '短信未配置' }
  if (go) go.disabled = !cfgd
  authTick()
}
function authTick(){
  var send = document.getElementById('lg-send')
  if (!send) return
  var left = Math.ceil((authState().lastSend + 60000 - Date.now()) / 1000)
  if (left > 0) { send.disabled = true; send.textContent = left + 's 后重发' }
  else if (authConfigured()) { send.disabled = false; send.textContent = '获取验证码' }
}
async function authSend(){
  if (!authConfigured()) { toast('短信服务尚未配置，无法发送验证码'); return }
  var cc = document.getElementById('lg-cc')
  var inp = document.getElementById('lg-phone')
  var err = document.getElementById('lg-err')
  var send = document.getElementById('lg-send')
  var phone = cc.value + (inp.value || '').replace(/\D/g, '')
  err.textContent = ''
  if ((inp.value || '').replace(/\D/g, '').length < 7) { err.textContent = '请输入正确的手机号'; return }
  send.disabled = true; send.textContent = '发送中…'
  try {
    await supa('/auth/v1/otp', { body: JSON.stringify({ phone: phone }) })
    var st = authState()
    st.phone = phone; st.lastSend = Date.now()
    lsSet(AUTH_KEY, st)
    toast('验证码已发送，请查收短信')
    var n = 60
    lgTimer = setInterval(function(){
      n--
      if (n <= 0) { clearInterval(lgTimer); authTick() }
      else send.textContent = n + 's 后重发'
    }, 1000)
  } catch (e) {
    err.textContent = authErrText(e)
    authTick()
  }
}
async function authVerify(){
  if (!authConfigured()) { toast('短信服务尚未配置，无法登录'); return }
  var otp = (document.getElementById('lg-otp').value || '').replace(/\D/g, '')
  var err = document.getElementById('lg-err')
  var go = document.getElementById('lg-go')
  var st = authState()
  err.textContent = ''
  if (otp.length < 4) { err.textContent = '请输入短信中的验证码'; return }
  if (!st.phone) { err.textContent = '请先获取验证码'; return }
  go.disabled = true; go.textContent = '验证中…'
  try {
    var res = await supa('/auth/v1/verify', { body: JSON.stringify({ type: 'sms', phone: st.phone, token: otp }) })
    st.access = res.access_token || ''
    st.refresh = res.refresh_token || ''
    st.exp = (res.expires_at || 0) * 1000
    st.phone = (res.user && res.user.phone) || st.phone
    lsSet(AUTH_KEY, st)
    toast('登录成功，欢迎回来')
    authClose()
    renderMe()
  } catch (e) {
    err.textContent = authErrText(e)
  } finally {
    go.disabled = !authConfigured(); go.textContent = '登录'
  }
}
async function authLogout(){
  var st = authState()
  if (st.access && authConfigured()) {
    try {
      await supa('/auth/v1/logout?scope=global', { headers: { 'Authorization': 'Bearer ' + st.access }, body: '{}' })
    } catch (e) {}
  }
  lsSet(AUTH_KEY, { phone: '', access: '', refresh: '', exp: 0, lastSend: 0 })
  toast('已退出登录，健身数据不受影响')
  renderMe()
}
function authSession(){
  /* 过期时静默刷新；刷新失败仅视为未登录，绝不清除健身数据 */
  var st = authState()
  if (!st.phone || !st.access) return null
  if (st.exp > Date.now()) return st
  if (!st.refresh) return null
  supa('/auth/v1/token?grant_type=refresh_token', { body: JSON.stringify({ refresh_token: st.refresh }) }).then(function(res){
    st.access = res.access_token
    st.refresh = res.refresh_token
    st.exp = (res.expires_at || 0) * 1000
    lsSet(AUTH_KEY, st)
  }).catch(function(){})
  return st
}

/* ================= 启动 ================= */
getExercises() // 首次启动写入默认动作
var bootDraft = getDraft()
if (bootDraft && bootDraft.date === todayStr()) state.train = bootDraft
switchTab('home')

/* Service Worker：离线缓存（仅 https 生效，失败静默；检测到新版本时提示刷新） */
try {
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing
        if (!nw) return
        nw.addEventListener('statechange', function () {
          if (nw.state === 'activated' && navigator.serviceWorker.controller) {
            var t = document.getElementById('upd-tip')
            if (t) t.style.display = 'block'
          }
        })
      })
    }).catch(function(){})
  }
} catch (e) {}

/* 离线横幅：数据全部存本机，离线只是拿不到新版本 */
function netState(){
  var t = document.getElementById('net-tip')
  if (!t) return
  if (!navigator.onLine) { t.textContent = '当前离线：显示已缓存版本，数据仍正常保存在本机'; t.style.display = 'block' }
  else t.style.display = 'none'
}
window.addEventListener('online', netState)
window.addEventListener('offline', netState)
netState()
